service_name: unified-llm-gateway

# 留空表示开发模式不校验调用方；生产环境请设置 GATEWAY_API_KEY。
api_keys:
  - ${GATEWAY_API_KEY:-}

database_url: data/gateway.db
structured_output_retries: 1

retry:
  max_attempts_per_route: 2
  base_delay_seconds: 0.25
  max_delay_seconds: 4
  retry_statuses: [408, 409, 429, 500, 502, 503, 504]

circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

# 默认关闭，避免在未评估隐私策略前保存模型正文。
stream_checkpoint:
  enabled: false
  flush_interval_seconds: 1
  max_chars: 200000

# 默认仅接入官方 DeepSeek；多供应商路由配置方法见 README。
providers:
  deepseek:
    # UpstreamClient 自己追加 /v1/...，此处不要再带 /v1。
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    timeout_seconds: 120

models:
  smart:
    strategy: priority
    routes:
      - provider: deepseek
        model: deepseek-flash
        api: both
  fast:
    strategy: priority
    routes:
      - provider: deepseek
        model: deepseek-flash
        api: both

# 未维护实时价格，成本字段为 0，占位值不能用于计费。
pricing: {}
